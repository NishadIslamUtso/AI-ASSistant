<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width:380px; background:#1a1a1a; color:#fff; font-family: ui-sans-serif, system-ui; margin:0; padding:0; }
.header { padding:12px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:14px; margin:0; }
.tabs { display:flex; border-bottom:1px solid #333; }
.tab { flex:1; padding:8px; text-align:center; cursor:pointer; font-size:12px; background:#1a1a1a; border:none; color:#aaa; }
.tab.active { background:#2a2a2a; color:#fff; }
.content { padding:12px; max-height:400px; overflow-y:auto; }
.capsule { background:#2a2a2a; border:1px solid #333; border-radius:8px; padding:10px; margin-bottom:8px; cursor:grab; font-size:12px; }
.capsule:hover { border-color:#555; }
.capsule-title { font-weight:600; margin-bottom:4px; }
.capsule-meta { color:#aaa; font-size:10px; }
.blacklist-item { display:flex; justify-content:space-between; background:#2a2a2a; padding:6px 8px; margin-bottom:4px; border-radius:6px; font-size:11px; align-items:center; }
input { background:#2a2a2a; border:1px solid #333; color:#fff; padding:8px; border-radius:6px; width:100%; box-sizing:border-box; font-size:12px; }
button { background:#3a3a3a; color:#fff; border:1px solid #444; padding:6px 12px; border-radius:20px; cursor:pointer; font-size:11px; }
button:hover { background:#4a4a4a; }
button.primary { background:#fff; color:#000; border-color:#fff; }
.log { font-size:10px; color:#aaa; background:#222; padding:6px; border-radius:6px; margin-bottom:4px; }
.permission-banner { background:#2a2a00; border:1px solid #554a00; padding:8px; border-radius:6px; font-size:11px; margin-bottom:10px; }
.permission-banner button { margin-top:6px; }
</style>
</head>
<body>
<div class="header">
  <h1>AI ASSistant Vault</h1>
  <span id="status" style="font-size:10px;color:#0a0;">● Local</span>
</div>
<div class="tabs">
  <button class="tab active" data-tab="capsules">Capsules</button>
  <button class="tab" data-tab="blacklist">Never-Check</button>
  <button class="tab" data-tab="activity">Activity</button>
</div>
<div class="content" id="capsules-tab">
  <div id="broad-banner" class="permission-banner" style="display:none;">
    Broad capture is off. AI sites only by default.<br>
    Enable to check every site (your default rule).<br>
    <button id="enable-broad">Enable broad access (all sites)</button>
  </div>
  <div id="history-banner" class="permission-banner" style="display:none;">
    Browser history trail off.<br>
    <button id="enable-history">Enable history trail (URL/title/time)</button>
  </div>
  <input id="search" placeholder="Search capsules..." style="margin-bottom:8px;">
  <div id="capsule-list"></div>
  <div style="margin-top:12px;">
    <button id="capture-current">Capture Current Page as Capsule</button>
  </div>
</div>
<div class="content" id="blacklist-tab" style="display:none;">
  <p style="font-size:11px;color:#aaa;">URLs/domains to never check. Empty = check everything (your rule).</p>
  <div style="display:flex;gap:6px;margin-bottom:8px;">
    <input id="blacklist-input" placeholder="e.g. bank.com/*">
    <button id="blacklist-add">Add</button>
  </div>
  <div id="blacklist-list"></div>
</div>
<div class="content" id="activity-tab" style="display:none;">
  <div id="activity-log"></div>
  <div style="display:flex;gap:6px;margin-top:8px;">
    <button id="clear-queue">Clear Queue</button>
    <button id="test-offline">Test offline queue</button>
  </div>
  <p style="font-size:10px;color:#666;margin-top:8px;">If you see "Queued, app offline" - start AI ASSistant app at 127.0.0.1:8765</p>
</div>
<script src="popup.js"></script>
</body>
</html>
