# The gate, on every push. Linux has always run this; Windows (the target
# OS) joined 2026-10-17 in allow-failure mode until it has run green once —
# a red X here is information, and hiding it would be the old habit this
# repo is trying to lose.
name: checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/03_ai-assistant
        run: npm install --no-audit --no-fund
      - name: Types
        working-directory: apps/03_ai-assistant
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        working-directory: apps/03_ai-assistant
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-linux.xml
      - name: Linux speaks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'apps/03_ai-assistant/junit-linux.xml';
            if (fs.existsSync(p)) {
              let raw = fs.readFileSync(p, 'utf8');
              if (raw.length > 30000) raw = '...truncated...' + raw.slice(-30000);
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha,
                body: 'linux junit (tail):\n```xml\n' + raw + '\n```'
              });
            }
      - name: Build
        working-directory: apps/03_ai-assistant
        run: npm run build

  windows:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/03_ai-assistant
        run: npm ci --no-audit --no-fund
      - name: Types
        working-directory: apps/03_ai-assistant
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        working-directory: apps/03_ai-assistant
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-windows.xml
      - name: Windows speaks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'apps/03_ai-assistant/junit-windows.xml';
            if (fs.existsSync(p)) {
              let raw = fs.readFileSync(p, 'utf8');
              if (raw.length > 30000) raw = '...truncated...' + raw.slice(-30000);
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha,
                body: 'windows junit (tail):\n```xml\n' + raw + '\n```'
              });
            }
      - name: Build
        working-directory: apps/03_ai-assistant
        run: npm run build
