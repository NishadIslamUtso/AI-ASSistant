# The gate, on every push. Linux has always run this; Windows (the target
# OS) joined 2026-10-17 in allow-failure mode until it has run green once —
# a red X here is information, and hiding it would be the old habit this
# repo is trying to lose.
name: checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/03_ai-assistant
        run: npm install --no-audit --no-fund
      - name: Types
        working-directory: apps/03_ai-assistant
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        working-directory: apps/03_ai-assistant
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-linux.xml
      - name: Linux speaks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'apps/03_ai-assistant/junit-linux.xml';
            if (fs.existsSync(p)) {
              const raw = fs.readFileSync(p, 'utf8');
              const lines = [];
              for (const suite of raw.split(/(?=<testsuite )/)) {
                const head = suite.match(/<testsuite name="([^"]+)"[^>]*failures="(\d+)" errors="(\d+)"/);
                if (!head || (head[2] === '0' && head[3] === '0')) continue;
                lines.push('FAILED SUITE ' + head[1] + ' (' + head[2] + ' failures, ' + head[3] + ' errors)');
                for (const m of suite.matchAll(/<testcase classname="[^"]*" name="([^"]*)"[^>]*>\s*<failure message="([^"]*)"/g)) {
                  lines.push('  - ' + m[1] + ' — ' + m[2].slice(0, 800));
                }
              }
              if (lines.length) {
                let body = lines.join('\n');
                if (body.length > 40000) body = body.slice(0, 40000) + '\n...truncated';
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: context.sha,
                  body: 'linux failures, in its own words:\n\n' + body
                });
              }
            }
      - name: Build
        working-directory: apps/03_ai-assistant
        run: npm run build

  windows:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/03_ai-assistant
        run: npm ci --no-audit --no-fund
      - name: Types
        working-directory: apps/03_ai-assistant
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        working-directory: apps/03_ai-assistant
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-windows.xml
      - name: Windows speaks
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'apps/03_ai-assistant/junit-windows.xml';
            if (fs.existsSync(p)) {
              const raw = fs.readFileSync(p, 'utf8');
              const lines = [];
              for (const suite of raw.split(/(?=<testsuite )/)) {
                const head = suite.match(/<testsuite name="([^"]+)"[^>]*failures="(\d+)" errors="(\d+)"/);
                if (!head || (head[2] === '0' && head[3] === '0')) continue;
                lines.push('FAILED SUITE ' + head[1] + ' (' + head[2] + ' failures, ' + head[3] + ' errors)');
                for (const m of suite.matchAll(/<testcase classname="[^"]*" name="([^"]*)"[^>]*>\s*<failure message="([^"]*)"/g)) {
                  lines.push('  - ' + m[1] + ' — ' + m[2].slice(0, 800));
                }
              }
              if (lines.length) {
                let body = lines.join('\n');
                if (body.length > 40000) body = body.slice(0, 40000) + '\n...truncated';
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: context.sha,
                  body: 'windows failures, in its own words:\n\n' + body
                });
              }
            }
      - name: Build
        working-directory: apps/03_ai-assistant
        run: npm run build
